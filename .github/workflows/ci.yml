name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Select Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned Wasm builder
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Audit dependencies
        run: vp run audit
      - name: Check source
        run: vp run check
      - name: Run contract tests
        run: vp run test:contracts
      - name: Install E2E browser
        run: vp exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: vp run test:e2e
      - name: Build deployment
        run: vp run build

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Select Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned Wasm builder
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build deployment
        run: vp run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run deploy
